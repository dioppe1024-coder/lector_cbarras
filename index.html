<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidación de Última Milla - Zonas</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; color: #f8fafc; }
        .container { max-width: 480px; width: 100%; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; font-size: 20px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .row-inputs { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-group { flex: 2; display: flex; flex-direction: column; }
        .form-group.sm { flex: 1; }
        label { margin-bottom: 6px; font-weight: 600; color: #94a3b8; font-size: 13px; text-transform: uppercase; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; background: #0f172a; border: 2px solid #334155; border-radius: 8px; font-size: 15px; color: #fff; text-transform: uppercase; }
        input:focus { border-color: #38bdf8; outline: none; }
        #video-container { width: 100%; height: 200px; background: #000; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid #334155; margin-bottom: 10px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-blue { background: #0284c7; color: white; }
        .btn-blue:hover { background: #0369a1; }
        .btn-orange { background: #ea580c; color: white; margin-bottom: 10px; }
        .btn-orange:hover { background: #c2410c; }
        .btn-green { background: #16a34a; color: white; font-size: 16px; margin-top: 15px; border: 2px solid #22c55e; }
        .btn-green:hover { background: #15803d; }
        .btn-danger { background: #dc2626; color: white; margin-top: 10px; font-size: 13px; padding: 8px; opacity: 0.7; }
        .btn:disabled { background: #475569 !important; color: #64748b !important; cursor: not-allowed; border-color: transparent; }
        .panel-status { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .counter-badge { float: right; background: #38bdf8; color: #0f172a; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
        ul { list-style: none; padding: 0; margin: 5px 0 0 0; max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #cbd5e1; }
        li { padding: 4px 0; border-bottom: 1px dashed #334155; }
        #global-status { text-align: center; font-weight: bold; margin-top: 15px; font-size: 14px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <h2>Liquidación Última Milla</h2>
    
    <div class="row-inputs">
        <div class="form-group">
            <label>Zona Actual</label>
            <input type="text" id="txtZona" placeholder="Ej: OLMOS">
        </div>
        <div class="form-group sm">
            <label>Precio S/.</label>
            <input type="number" id="txtPrecio" placeholder="0.00" step="0.10">
        </div>
    </div>

    <div id="video-container">
        <video id="preview"></video>
    </div>
    <button type="button" class="btn btn-blue" id="btnCambiarCamara" style="padding: 8px; font-size: 13px; margin-bottom: 15px;">🔄 Alternar Lente</button>

    <div class="panel-status">
        <span class="counter-badge" id="lblCountZona">0</span>
        <label style="color: #38bdf8;">Guías en Zona Actual</label>
        <ul id="listaZonaActual"></ul>
    </div>

    <button type="button" class="btn btn-orange" id="btnGuardarZona" style="margin-top: 12px;">📥 Cerrar y Guardar Lote Zona</button>

    <div class="panel-status" style="border-color: #16a34a; margin-top: 15px;">
        <span class="counter-badge" id="lblTotalZonas" style="background:#22c55e;">0</span>
        <label style="color: #22c55e;">Total Zonas Listas para Envío</label>
        <div id="resumenZonasMemoria" style="font-size: 13px; color: #94a3b8; margin-top: 5px; font-family: monospace;">Ninguna zona guardada aún.</div>
    </div>

    <button type="button" class="btn btn-green" id="btnEnviarFinal" disabled>🚀 Enviar todas las zonas a la BD</button>
    <button type="button" class="btn btn-danger" id="btnCerrar">❌ Salir del Módulo</button>

    <div id="global-status"></div>
</div>

<script>
    // URL DE CONTROL DE TU GOOGLE APPS SCRIPT (MANTÉN TU URL ACTUAL)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyX_JfM2y9nMwrJgB6W6lbIOYjd9dfPogsCM73tZubmqVZkaGJB8H3reChNVpv30qsq/exec";

    let codeReader = null;
    let lasCamarasDisponibles = [];
    let indiceCamaraActual = 0;
    let ejecutandoStreaming = false;
    let encendidoParaLectura = true; // Control de retardo (medio segundo)

    // Estructuras de Datos Locales
    let guiasZonaActual = [];
    let todasLasZonasMemoria = []; // Aquí se acumulan los lotes [{titulo: 'OLMOS', precio: 5, codigos: [...]}]

    // Captura UI
    const txtZona = document.getElementById('txtZona');
    const txtPrecio = document.getElementById('txtPrecio');
    const listaZonaActualUI = document.getElementById('listaZonaActual');
    const lblCountZona = document.getElementById('lblCountZona');
    const btnGuardarZona = document.getElementById('btnGuardarZona');
    const lblTotalZonas = document.getElementById('lblTotalZonas');
    const resumenZonasMemoria = document.getElementById('resumenZonasMemoria');
    const btnEnviarFinal = document.getElementById('btnEnviarFinal');
    const btnCambiarCamara = document.getElementById('btnCambiarCamara');
    const btnCerrar = document.getElementById('btnCerrar');
    const globalStatus = document.getElementById('global-status');

    window.addEventListener('DOMContentLoaded', () => {
        codeReader = new ZXing.BrowserMultiFormatReader();
        inicializarCamaras();
    });

    // Pitido electrónico nativo mediante Web Audio API
    function emitirPitidoSuave() {
        try {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let oscillator = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine'; // Tono limpio
            oscillator.frequency.value = 1000; // Frecuencia del pitido en Hz
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volumen suave
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.08); // Duración corta (80ms)
        } catch (e) {
            console.log("Audio no soportado aún en este navegador.");
        }
    }

    function inicializarCamaras() {
        codeReader.listVideoInputDevices()
            .then((devices) => {
                lasCamarasDisponibles = devices;
                if (devices.length === 0) return;
                let indiceTrasero = devices.findIndex(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('environment') ||
                    device.label.toLowerCase().includes('trasera')
                );
                indiceCamaraActual = indiceTrasero !== -1 ? indiceTrasero : 0;
                encenderCamara(lasCamarasDisponibles[indiceCamaraActual].deviceId);
            }).catch(err => console.log(err));
    }

    function encenderCamara(deviceId) {
        if (ejecutandoStreaming) codeReader.reset();
        ejecutandoStreaming = true;
        codeReader.decodeFromVideoDevice(deviceId, 'preview', (result, err) => {
            if (result && encendidoParaLectura) {
                // Bloqueo inmediato para evitar lecturas duplicadas continuas
                encendidoParaLectura = false; 
                
                procesarEscaneoInmediato(result.text);
                
                // Retardo adaptativo de medio segundo (500 milisegundos) para reactivar
                setTimeout(() => {
                    encendidoParaLectura = true;
                }, 500); 
            }
        });
    }

    btnCambiarCamara.addEventListener('click', () => {
        if (lasCamarasDisponibles.length <= 1) return;
        indiceCamaraActual = (indiceCamaraActual + 1) % lasCamarasDisponibles.length;
        encenderCamara(lasCamarasDisponibles[indiceCamaraActual].deviceId);
    });

    function procesarEscaneoInmediato(codigo) {
        let codLimpio = codigo.trim().toUpperCase();
        if (codLimpio === "" || guiasZonaActual.includes(codLimpio)) return;

        emitirPitidoSuave();
        if (navigator.vibrate) navigator.vibrate(60);

        guiasZonaActual.push(codLimpio);
        
        // Renderizar en la lista visual de la zona
        let li = document.createElement('li');
        li.textContent = "📦 " + codLimpio;
        listaZonaActualUI.appendChild(li);
        lblCountZona.textContent = guiasZonaActual.length;
    }

    // BOTÓN: Guardar lote de zona actual y limpiar para la siguiente
    btnGuardarZona.addEventListener('click', () => {
        let zona = txtZona.value.trim().toUpperCase();
        let precio = txtPrecio.value.trim();

        if (zona === "" || precio === "") {
            alert("⚠️ DEBES RELLENAR EL NOMBRE DE LA ZONA Y EL PRECIO UNITARIO ANTES DE GUARDAR EL LOTE.");
            return;
        }
        if (guiasZonaActual.length === 0) {
            alert("⚠️ NO HAY GUÍAS ESCANEADAS EN ESTA ZONA.");
            return;
        }

        // Empaquetar lote en el arreglo definitivo de memoria
        todasLasZonasMemoria.push({
            titulo: zona,
            precio: precio,
            codigos: guiasZonaActual
        });

        // Limpieza de campos para permitir la siguiente zona (ej: Insculas)
        guiasZonaActual = [];
        txtZona.value = "";
        txtPrecio.value = "";
        listaZonaActualUI.innerHTML = "";
        lblCountZona.textContent = "0";

        // Actualizar resumen en memoria
        actualizarResumenGlobal();
    });

    function actualizarResumenGlobal() {
        lblTotalZonas.textContent = todasLasZonasMemoria.length;
        if (todasLasZonasMemoria.length === 0) {
            resumenZonasMemoria.innerHTML = "Ninguna zona guardada aún.";
            btnEnviarFinal.disabled = true;
            return;
        }

        let htmlResumen = "";
        todasLasZonasMemoria.forEach(z => {
            htmlResumen += `• ${z.titulo} (S/.${z.precio}): ${z.codigos.length} guías<br>`;
        });
        resumenZonasMemoria.innerHTML = htmlResumen;
        btnEnviarFinal.disabled = false; // Habilitar el botón definitivo de base de datos
    }

    // BOTÓN: Enviar todo el acumulado del día a Google Sheets
    btnEnviarFinal.addEventListener('click', () => {
        globalStatus.textContent = "Transmitiendo liquidaciones masivas...";
        btnEnviarFinal.disabled = true;

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            cache: "no-cache",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ zonas: todasLasZonasMemoria })
        })
        .then(() => {
            globalStatus.innerHTML = "🎉 ¡LIQUIDACIÓN ENVIADA CON ÉXITO A LA BD! ✓";
            todasLasZonasMemoria = [];
            actualizarResumenGlobal();
        })
        .catch(err => {
            globalStatus.textContent = "Falla de red: " + err;
            btnEnviarFinal.disabled = false;
        });
    });

    btnCerrar.addEventListener('click', () => {
        if (confirm("¿Cerrar módulo? Se perderán las zonas pendientes que no se hayan enviado a la base de datos.")) {
            codeReader.reset();
            document.body.innerHTML = `<div class="container" style="text-align:center;"><h2>Módulo Detenido</h2><p>Cámara apagada de forma segura.</p></div>`;
        }
    });
</script>

</body>
</html>
