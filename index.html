<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Scanner Reutilizable - MAGSA</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e293b; margin-top: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-transform: uppercase; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #2563eb; outline: none; }
        #video-container { width: 100%; height: 250px; background: #000; border-radius: 8px; overflow: hidden; position: relative; margin-bottom: 10px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; text-transform: uppercase; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn-secondary:hover { background-color: #475569; }
        .btn-success { background-color: #10b981; color: white; margin-top: 10px; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        .list-container { margin-top: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; max-height: 200px; overflow-y: auto; }
        .list-title { font-weight: bold; color: #334155; margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 6px 0; border-bottom: 1px dashed #e2e8f0; font-family: monospace; font-size: 15px; color: #334155; display: flex; justify-content: space-between; }
        li::before { content: "✓ "; color: #10b981; font-weight: bold; }
        #status-message { text-align: center; font-weight: 600; margin-top: 10px; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Scanner Corporativo</h2>
    
    <div class="form-group">
        <label for="txtTitulo">Título / Módulo del Escaneo *</label>
        <input type="text" id="txtTitulo" placeholder="Ej: INVENTARIO PASILLO 1, RECEPCION PROVEEDOR" required>
    </div>

    <div id="video-container">
        <video id="preview"></video>
    </div>

    <button type="button" class="btn btn-secondary" id="btnCambiarCamara">🔄 Cambiar Cámara</button>
    
    <div class="form-group" style="margin-top: 15px;">
        <label>Entrada Manual Básica</label>
        <input type="text" id="txtManual" placeholder="Escribe código si la cámara falla y presiona Enter">
    </div>

    <div class="list-container">
        <div class="list-title">Códigos Acumulados (<span id="lblContador">0</span>)</div>
        <ul id="listaCodigos"></ul>
    </div>

    <button type="button" class="btn btn-success" id="btnEnviarBD" disabled>🚀 Enviar Datos a Base de Datos</button>
    <button type="button" class="btn btn-danger" id="btnCerrar" style="margin-top: 10px;">❌ Cerrar Aplicación</button>

    <div id="status-message"></div>
</div>

<script>
    // URL DE CONTROL DE GOOGLE APPS SCRIPT
    // ¡REEMPLAZA ESTA URL CON TU ENLACE ACTUAL QUE TERMINA EN /exec!
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyX_JfM2y9nMwrJgB6W6lbIOYjd9dfPogsCM73tZubmqVZkaGJB8H3reChNVpv30qsq/exec";

    let codeReader = null;
    let listaLocalCodigos = [];
    let lasCamarasDisponibles = [];
    let indiceCamaraActual = 0;
    let ejecutandoStreaming = false;

    // Captura de elementos de la interfaz gráfica
    const txtTitulo = document.getElementById('txtTitulo');
    const txtManual = document.getElementById('txtManual');
    const listaCodigosUI = document.getElementById('listaCodigos');
    const lblContador = document.getElementById('lblContador');
    const btnEnviarBD = document.getElementById('btnEnviarBD');
    const btnCambiarCamara = document.getElementById('btnCambiarCamara');
    const btnCerrar = document.getElementById('btnCerrar');
    const statusMessage = document.getElementById('status-message');

    // Inicialización del entorno al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
        codeReader = new ZXing.BrowserMultiFormatReader();
        inicializarCamaras();
    });

    // Detectar hardware de cámaras e iniciar preferentemente la trasera
    function inicializarCamaras() {
        codeReader.listVideoInputDevices()
            .then((devices) => {
                lasCamarasDisponibles = devices;
                if (devices.length === 0) {
                    mostrarStatus("No se encontraron cámaras físicas.", "red");
                    return;
                }

                // Intentar buscar la cámara trasera automáticamente ("back", "environment" o "rear")
                let indiceTrasero = devices.findIndex(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('environment') ||
                    device.label.toLowerCase().includes('trasera')
                );

                // Si se encuentra la trasera la fijamos, de lo contrario usamos la primera disponible
                indiceCamaraActual = indiceTrasero !== -1 ? indiceTrasero : 0;
                encenderCamara(lasCamarasDisponibles[indiceCamaraActual].deviceId);
            })
            .catch(err => mostrarStatus("Error accediendo a cámaras: " + err, "red"));
    }

    // Encender el flujo de video en tiempo real e interceptar lecturas de códigos
    function encenderCamara(deviceId) {
        if (ejecutandoStreaming) {
            codeReader.reset();
        }
        ejecutandoStreaming = true;
        codeReader.decodeFromVideoDevice(deviceId, 'preview', (result, err) => {
            if (result) {
                agregarCodigoALaLista(result.text);
                // Vibración táctil corta para indicar captura (si el dispositivo lo soporta)
                if (navigator.vibrate) navigator.vibrate(100);
            }
        });
    }

    // Evento para alternar entre cámara trasera y delantera
    btnCambiarCamara.addEventListener('click', () => {
        if (lasCamarasDisponibles.length <= 1) {
            mostrarStatus("Tu dispositivo solo cuenta con una cámara activa.", "orange");
            return;
        }
        indiceCamaraActual = (indiceCamaraActual + 1) % lasCamarasDisponibles.length;
        encenderCamara(lasCamarasDisponibles[indiceCamaraActual].deviceId);
    });

    // Agregar códigos capturados a nuestro arreglo local
    function agregarCodigoALaLista(codigo) {
        let codLimpio = codigo.trim().toUpperCase();
        if (codLimpio === "") return;

        listaLocalCodigos.push(codLimpio);
        actualizarInterfazLista();
    }

    // Escucha de caja manual al presionar Enter
    txtManual.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            agregarCodigoALaLista(txtManual.value);
            txtManual.value = "";
        }
    });

    // Refrescar la pantalla con los elementos recolectados
    function actualizarInterfazLista() {
        listaCodigosUI.innerHTML = "";
        listaLocalCodigos.forEach(cod => {
            let li = document.createElement('li');
            li.textContent = cod;
            listaCodigosUI.appendChild(li);
        });
        lblContador.textContent = listaLocalCodigos.length;
        // Habilitar botón de envío únicamente si hay códigos acumulados
        btnEnviarBD.disabled = listaLocalCodigos.length === 0;
    }

    // Proceso de validación y envío empaquetado hacia Google Sheets
    btnEnviarBD.addEventListener('click', () => {
        // Validación obligatoria del título corporativo
        if (txtTitulo.value.trim() === "") {
            alert("⚠️ POR FAVOR, DIGITA UN TÍTULO O DESCRIPCIÓN PARA ESTE LOTE DE ESCANEO ANTES DE ENVIAR.");
            txtTitulo.focus();
            return;
        }

        mostrarStatus("Transmitiendo datos de forma segura...", "#2563eb");
        btnEnviarBD.disabled = true;

        const payload = {
            titulo: txtTitulo.value.toUpperCase().trim(),
            codigos: listaLocalCodigos
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", // Evita problemas de políticas Cross-Origin
            cache: "no-cache",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            mostrarStatus("¡GUARDADO EN MAYÚSCULAS CON ÉXITO! ✓", "#10b981");
            listaLocalCodigos = []; // Limpiar cola local
            actualizarInterfazLista();
        })
        .catch(err => {
            mostrarStatus("Falla al inyectar datos: " + err, "#ef4444");
            btnEnviarBD.disabled = false;
        });
    });

    // Cerrar la aplicación y apagar hardware de cámara
    btnCerrar.addEventListener('click', () => {
        if (confirm("¿Estás seguro de que deseas cerrar la aplicación? Se perderán las lecturas que no hayas enviado.")) {
            codeReader.reset();
            document.body.innerHTML = `
                <div class="container" style="text-align:center; padding:40px;">
                    <h3 style="color:#475569;">Aplicación Cerrada Correctamente</h3>
                    <p style="color:#64748b;">El hardware de la cámara ha sido apagado de forma segura.</p>
                </div>
            `;
        }
    });

    function mostrarStatus(msg, color) {
        statusMessage.textContent = msg;
        statusMessage.style.color = color;
    }
</script>

</body>
</html>
